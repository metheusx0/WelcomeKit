<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome to Worxphere</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-dark: #0a0a0a;
    --bg-light: #e8e6e1;
    --text-dark: #111111;
    --font-en: 'Syne', sans-serif;
    --font-kr: 'Noto Sans KR', sans-serif;
  }

  html { scroll-behavior: smooth; }
  body { background: var(--bg-dark); overflow-x: hidden; }

  /* ── Section 1: Hero Image ── */
  .section-hero {
    width: 100%;
    min-height: 100svh;
    overflow: hidden;
  }

  .section-hero img {
    width: 100%;
    height: 100svh;
    object-fit: cover;
    object-position: center top;
    display: block;
  }

  /* ── Section 2: 우리가 일하는 방식 ── */
  .section-way {
    background: var(--bg-light);
    padding: 100px 48px 120px;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .way-title {
    font-family: var(--font-kr);
    font-size: clamp(36px, 6vw, 56px);
    font-weight: 700;
    color: var(--text-dark);
    line-height: 1.2;
    margin-bottom: 72px;
    letter-spacing: -0.02em;
  }

  .way-body {
    display: flex;
    flex-direction: column;
    gap: 48px;
    max-width: 640px;
  }

  .way-block {
    display: flex;
    gap: 28px;
    align-items: stretch;
  }

  .way-bar {
    width: 1.5px;
    background: var(--text-dark);
    flex-shrink: 0;
    opacity: 0.35;
  }

  .way-text {
    font-family: var(--font-kr);
    font-size: clamp(15px, 2.2vw, 19px);
    font-weight: 400;
    color: var(--text-dark);
    line-height: 2;
    letter-spacing: -0.01em;
  }

  /* ── Section 3: Kit Image ── */
  .section-kit {
    width: 100%;
    overflow: hidden;
  }

  .section-kit img {
    width: 100%;
    height: auto;
    display: block;
  }

  /* ── Mobile ── */
  @media (max-width: 480px) {
    .section-way { padding: 72px 28px 88px; }
    .way-title { margin-bottom: 48px; }
  }
</style>
</head>
<body>

  <!-- Section 1: Hero -->
  <section class="section-hero">
    <img src="intro.png" alt="Welcome to Worxphere">
  </section>

  <!-- Section 2: 우리가 일하는 방식 -->
  <section class="section-way">
    <h2 class="way-title">우리가<br>일하는 방식</h2>
    <div class="way-body">
      <div class="way-block">
        <div class="way-bar"></div>
        <p class="way-text">
          우리는 성장을 기록하고,<br>
          함께 대화하며,<br>
          서로의 우산이 되고,<br>
          일 너머를 경험합니다.
        </p>
      </div>
      <div class="way-block">
        <div class="way-bar"></div>
        <p class="way-text">
          이곳은 우리가 일하는 방식이자,<br>
          당신이 경험하게 될 여정의 시작점입니다.
        </p>
      </div>
    </div>
  </section>

  <!-- Section 3: 일상으로 이어지는 경험 -->
  <section class="section-kit">
    <img src="kit.png" alt="일상으로 이어지는 경험">
  </section>

</body>
</html>
